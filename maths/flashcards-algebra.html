<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra Flashcards — Year 8 Maths</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--accent:#a78bfa;--accent2:#c4b5fd;--correct:#10b981;--wrong:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--border:#2d3748}
  *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh}
  header{background:linear-gradient(135deg,#4c1d95,#a78bfa);padding:1.2rem 2rem;display:flex;align-items:center;gap:1rem}
  header .back{color:#fff;text-decoration:none;font-size:1.4rem}header h1{font-family:'Fredoka One',cursive;font-size:1.6rem;color:#fff}
  header .badge{margin-left:auto;background:rgba(0,0,0,0.3);border-radius:20px;padding:0.3rem 1rem;font-weight:700;color:#fff;font-size:0.9rem}
  .container{max-width:780px;margin:0 auto;padding:2rem 1rem}
  .progress-row{display:flex;gap:1.5rem;background:var(--card);border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.5rem;border:1px solid var(--border);flex-wrap:wrap;align-items:center}
  .prog-item{text-align:center}.prog-item .val{font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--accent)}.prog-item .lbl{font-size:0.72rem;color:var(--muted)}
  .prog-bar-wrap{flex:1;min-width:120px;background:var(--border);border-radius:99px;height:8px;overflow:hidden}
  .prog-bar{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s}
  .card-counter{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:0.75rem}
  .scene{width:100%;height:300px;perspective:1000px;margin-bottom:1.2rem;cursor:pointer}
  @media(max-width:560px){.scene{height:260px}}
  .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.5s ease}
  .scene.flipped .card-inner{transform:rotateY(180deg)}
  .card-face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:2rem;border:2px solid var(--border)}
  .card-front{background:linear-gradient(135deg,var(--card),var(--card2));flex-direction:column;gap:1rem}
  .card-front .label{font-size:0.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:800}
  .card-front .term{font-family:'Fredoka One',cursive;font-size:1.5rem;text-align:center;line-height:1.3}
  .card-front .tap-hint{font-size:0.8rem;color:var(--muted)}
  .card-back{background:linear-gradient(135deg,#1e293b,#0f172a);flex-direction:column;gap:0.75rem;transform:rotateY(180deg);overflow-y:auto;align-items:flex-start;padding:1.5rem 2rem}
  .card-back .back-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);font-weight:800;align-self:center}
  .card-back .definition{font-size:1rem;font-weight:700;line-height:1.5}
  .card-back .example{margin-top:0.5rem;background:rgba(0,0,0,0.4);border-left:3px solid var(--accent);padding:0.75rem 1rem;border-radius:0 8px 8px 0;font-size:0.9rem;line-height:1.6;color:#cbd5e1}
  .card-back .example strong{color:var(--accent2)}
  .action-row{display:flex;gap:0.75rem;justify-content:center;margin-bottom:1.2rem;flex-wrap:wrap}
  .btn{padding:0.75rem 1.5rem;border-radius:10px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;transition:all 0.2s}
  .btn-gotit{background:var(--correct);color:#fff}.btn-notyet{background:var(--wrong);color:#fff}
  .btn-primary{background:var(--accent);color:#000}.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}.btn-sm{font-size:0.85rem;padding:0.5rem 1rem}
  .nav-row{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
  .ctrl-row{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
  .pile-row{display:flex;gap:1rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
  .pile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.5rem 1rem;font-size:0.85rem;font-weight:700}
  .pile.gotit{border-color:var(--correct);color:var(--correct)}.pile.notyet{border-color:var(--wrong);color:var(--wrong)}
  .mode-banner{background:#1e3a2f;border:1px solid var(--correct);border-radius:10px;padding:0.6rem 1rem;text-align:center;font-size:0.85rem;color:#6ee7b7;margin-bottom:1rem;display:none}
  .ai-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-top:2rem}
  .ai-panel h3{font-family:'Fredoka One',cursive;color:var(--accent);margin-bottom:0.5rem;font-size:1.3rem}.ai-panel p{color:var(--muted);font-size:0.9rem;margin-bottom:1rem}
  .ai-status{font-size:0.9rem;color:var(--muted);margin-top:0.75rem;min-height:1.2em;font-style:italic}
  .ai-key-row{display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap}
  .ai-key-row input{flex:1;min-width:200px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.9rem;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.9rem}
  .ai-key-row input:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <a href="hub.html" class="back">&#8678;</a>
  <h1>&#128290; Algebra Flashcards</h1>
  <div class="badge" id="header-badge">1 / 20</div>
</header>
<div class="container">
  <div class="progress-row">
    <div class="prog-item"><div class="val" id="p-gotit">0</div><div class="lbl">Got It</div></div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="prog-item"><div class="val" id="p-notyet">0</div><div class="lbl">Not Yet</div></div>
    <div class="prog-item"><div class="val" id="p-unseen">20</div><div class="lbl">Unseen</div></div>
  </div>
  <div class="mode-banner" id="mode-banner">&#128218; Study Not Yet Mode</div>
  <div class="card-counter" id="card-counter">Card 1 of 20</div>
  <div class="scene" id="scene" onclick="flipCard()">
    <div class="card-inner">
      <div class="card-face card-front"><div class="label">Concept / Rule</div><div class="term" id="card-term"></div><div class="tap-hint">Tap to reveal</div></div>
      <div class="card-face card-back"><div class="back-label">Explanation + Worked Example</div><div class="definition" id="card-def"></div><div class="example" id="card-ex"></div></div>
    </div>
  </div>
  <div class="action-row">
    <button class="btn btn-notyet" onclick="markCard('notyet')">&#10007; Not Yet</button>
    <button class="btn btn-gotit" onclick="markCard('gotit')">&#10003; Got It!</button>
  </div>
  <div class="nav-row">
    <button class="btn btn-secondary btn-sm" onclick="prevCard()">&#8592; Prev</button>
    <button class="btn btn-secondary btn-sm" onclick="nextCard()">Next &#8594;</button>
  </div>
  <div class="ctrl-row">
    <button class="btn btn-secondary btn-sm" onclick="shuffleCards()">&#128256; Shuffle</button>
    <button class="btn btn-secondary btn-sm" onclick="studyNotYet()">&#128218; Study Not Yet</button>
    <button class="btn btn-secondary btn-sm" onclick="resetAll()">&#8634; Reset All</button>
    <button class="btn btn-secondary btn-sm" onclick="resetOriginal()">&#8635; Original 20</button>
  </div>
  <div class="pile-row">
    <div class="pile gotit">Got It: <span id="pile-gotit">0</span></div>
    <div class="pile notyet">Not Yet: <span id="pile-notyet">0</span></div>
  </div>
  <div class="ai-panel">
    <h3>&#129302; Generate More Cards</h3>
    <p>Mr. Euler creates new Algebra flashcards, CheckerBot verifies them.</p>
    <div class="ai-key-row">
      <input type="password" id="api-key" placeholder="Paste your Anthropic API key here...">
      <button class="btn btn-primary" onclick="generateAI()">Generate 5 More</button>
    </div>
    <div class="ai-status" id="ai-status"></div>
  </div>
</div>
<script>
const SEED_CARDS = [
  {term:"Expanding Single Brackets",def:"Multiply the term outside the bracket by EVERY term inside. Don't forget signs!",ex:"<strong>Expand 4(3x - 2):</strong><br>4 x 3x = 12x<br>4 x (-2) = -8<br><strong>= 12x - 8</strong>"},
  {term:"Expanding Double Brackets (FOIL)",def:"First, Outer, Inner, Last. Multiply each pair, then collect like terms.",ex:"<strong>Expand (x+3)(x+5):</strong><br>F: x&#178; &nbsp;O: 5x &nbsp;I: 3x &nbsp;L: 15<br><strong>= x&#178; + 8x + 15</strong>"},
  {term:"Factorising — Common Factor",def:"Find the HCF of all terms and place it outside the bracket.",ex:"<strong>Factorise 6x&#178; + 9x:</strong><br>HCF = 3x<br>3x(2x + 3)<br>Check: 3x(2x)=6x&#178;, 3x(3)=9x &#10003;"},
  {term:"Factorising Quadratics x&#178; + bx + c",def:"Find two numbers that multiply to c AND add to b.",ex:"<strong>Factorise x&#178; + 7x + 12:</strong><br>Need: ? x ? = 12, ? + ? = 7<br>3 x 4 = 12, 3+4 = 7<br><strong>= (x+3)(x+4)</strong>"},
  {term:"Solving Linear Equations",def:"Keep the equation balanced — do the same to both sides to isolate x.",ex:"<strong>Solve 5x + 3 = 23:</strong><br>5x = 23 - 3 = 20<br>x = 20 / 5<br><strong>x = 4</strong> &#10003; Check: 5(4)+3=23"},
  {term:"Equations: Unknowns on Both Sides",def:"Move x terms to one side, numbers to the other. Always check your answer.",ex:"<strong>Solve 7x - 4 = 3x + 12:</strong><br>7x - 3x = 12 + 4<br>4x = 16<br><strong>x = 4</strong>"},
  {term:"Equations with Brackets",def:"Expand the brackets first, then solve the resulting linear equation.",ex:"<strong>Solve 3(2x - 1) = 15:</strong><br>6x - 3 = 15<br>6x = 18<br><strong>x = 3</strong>"},
  {term:"Equations with Fractions",def:"Multiply every term by the denominator to clear the fraction, then solve.",ex:"<strong>Solve (x+2)/3 = 5:</strong><br>x + 2 = 15<br><strong>x = 13</strong> &#10003; Check: (13+2)/3 = 5"},
  {term:"nth Term of a Linear Sequence",def:"Find the common difference d. nth term = dn + (first term - d).",ex:"<strong>Sequence: 5, 8, 11, 14...</strong><br>d = 3 (goes up by 3 each time)<br>When n=1: 3(1)+?=5, so ?=2<br><strong>nth term = 3n + 2</strong>"},
  {term:"y = mx + c",def:"m = gradient (steepness), c = y-intercept (where the line crosses the y-axis).",ex:"<strong>y = 2x + 3:</strong><br>Gradient = 2<br>y-intercept = 3, i.e. passes through (0,3)<br>When x=4: y = 2(4)+3 = <strong>11</strong>"},
  {term:"Finding Gradient from Two Points",def:"Gradient = (y2 - y1) / (x2 - x1) = rise / run",ex:"<strong>Points (1,3) and (5,11):</strong><br>m = (11-3)/(5-1) = 8/4 = <strong>2</strong>"},
  {term:"Parallel Lines",def:"Parallel lines have identical gradients. Only the y-intercept (c) is different.",ex:"<strong>Lines parallel to y = 3x + 1:</strong><br>All have m = 3<br>e.g. y = 3x - 4 or y = 3x + 7<br><strong>Same gradient, different c</strong>"},
  {term:"Substitution",def:"Replace each variable with its given number. Follow BIDMAS order carefully.",ex:"<strong>Find 3n&#178; - 5n when n = 4:</strong><br>3(16) - 5(4)<br>= 48 - 20 = <strong>28</strong>"},
  {term:"Expanding (a + b)&#178;",def:"(a+b)&#178; = (a+b)(a+b). Use FOIL. Note: NOT a&#178; + b&#178;!",ex:"<strong>Expand (x + 4)&#178;:</strong><br>(x+4)(x+4)<br>= x&#178; + 4x + 4x + 16<br><strong>= x&#178; + 8x + 16</strong>"},
  {term:"Solving Quadratic Equations",def:"Factorise, set each bracket equal to zero, solve each.",ex:"<strong>Solve x&#178; - 5x + 6 = 0:</strong><br>(x-2)(x-3) = 0<br>x-2=0 or x-3=0<br><strong>x = 2 or x = 3</strong>"},
  {term:"Simultaneous Equations (Elimination)",def:"Add or subtract equations to eliminate one variable. Substitute back to find the other.",ex:"<strong>2x+y=7 and x+y=4:</strong><br>Subtract: x = 3<br>Substitute: 3+y=4, y=1<br><strong>x=3, y=1</strong>"},
  {term:"Simultaneous Equations (Substitution)",def:"Rearrange one equation for one variable, substitute into the other.",ex:"<strong>y=2x-1 and 3x+y=9:</strong><br>3x+(2x-1)=9<br>5x=10, x=2<br>y=2(2)-1=3<br><strong>x=2, y=3</strong>"},
  {term:"Quadratic Graphs y = x&#178;",def:"Parabola shape — symmetrical, U-shaped if a > 0. Create a table of values.",ex:"<strong>y = x&#178; - 4: key points</strong><br>x=-2: y=0, x=-1: y=-3<br>x=0: y=-4, x=1: y=-3<br>x=2: y=0<br>Crosses x-axis at ±2"},
  {term:"Difference of Two Squares",def:"a&#178; - b&#178; = (a+b)(a-b). Both terms must be perfect squares.",ex:"<strong>Factorise x&#178; - 25:</strong><br>= x&#178; - 5&#178;<br><strong>= (x+5)(x-5)</strong><br>Check: (x+5)(x-5) = x&#178;-25 &#10003;"},
  {term:"Writing Algebraic Expressions",def:"Convert words to algebra: 'more than' = +, 'product' = x, 'squared' = &#178;",ex:"<strong>'5 more than twice n':</strong><br>= 2n + 5<br><strong>'The square of the sum of x and 3':</strong><br>= (x+3)&#178;"},
];
const AI_TOPIC = 'ALGEBRA (expanding brackets, factorising, solving equations, sequences, y=mx+c, quadratic factorising, simultaneous equations)';
let cards=[...SEED_CARDS],current=0,status=new Array(cards.length).fill(null),studyMode=false,studyQueue=[];
function getDisplayCards(){return studyMode?studyQueue:cards}
function render(){const d=getDisplayCards(),c=d[current];if(!c)return;document.getElementById('scene').classList.remove('flipped');document.getElementById('card-term').textContent=c.term;document.getElementById('card-def').innerHTML=c.def;document.getElementById('card-ex').innerHTML=c.ex;document.getElementById('card-counter').textContent='Card '+(current+1)+' of '+d.length;document.getElementById('header-badge').textContent=(current+1)+' / '+d.length;updateProgress()}
function flipCard(){document.getElementById('scene').classList.toggle('flipped')}
function prevCard(){if(current>0){current--;render()}}
function nextCard(){const d=getDisplayCards();if(current<d.length-1){current++;render()}}
function markCard(r){const d=getDisplayCards(),c=d[current],idx=cards.indexOf(c);if(idx>=0)status[idx]=r;updateProgress();setTimeout(function(){if(current<d.length-1){current++;render()}},300)}
function updateProgress(){const g=status.filter(function(s){return s==='gotit'}).length,n=status.filter(function(s){return s==='notyet'}).length;document.getElementById('p-gotit').textContent=g;document.getElementById('p-notyet').textContent=n;document.getElementById('p-unseen').textContent=cards.length-g-n;document.getElementById('pile-gotit').textContent=g;document.getElementById('pile-notyet').textContent=n;document.getElementById('prog-bar').style.width=(cards.length?Math.round(g/cards.length*100):0)+'%'}
function shuffleCards(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];[status[i],status[j]]=[status[j],status[i]]}current=0;studyMode=false;document.getElementById('mode-banner').style.display='none';render()}
function studyNotYet(){studyQueue=cards.filter(function(_,i){return status[i]==='notyet'||status[i]===null});if(!studyQueue.length){alert('No Not Yet cards!');return}studyMode=true;current=0;document.getElementById('mode-banner').style.display='block';render()}
function resetAll(){status=new Array(cards.length).fill(null);current=0;studyMode=false;document.getElementById('mode-banner').style.display='none';render()}
function resetOriginal(){cards=[...SEED_CARDS];status=new Array(cards.length).fill(null);current=0;studyMode=false;document.getElementById('mode-banner').style.display='none';render()}
async function generateAI(){const key=document.getElementById('api-key').value.trim();if(!key){document.getElementById('ai-status').textContent='Please enter your API key.';return}const s=document.getElementById('ai-status');s.textContent='Mr. Euler is creating 5 new Algebra flashcards...';const p='You are Mr. Euler, expert Year 8 UK Maths teacher. Create 5 flashcards on '+AI_TOPIC+'. Each card: front=rule/formula/concept, back=explanation+worked example. British English. JSON only: [{"term":"","def":"","ex":"HTML with strong tags"}]';try{const r1=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:p}]})});const d1=await r1.json();const newCards=JSON.parse(d1.content[0].text.trim().replace(/```json|```/g,''));s.textContent='CheckerBot verifying...';const cp='You are CheckerBot. Verify 5 Algebra flashcards: arithmetic correct, explanation clear, KS3 appropriate. '+JSON.stringify(newCards)+'. Respond: APPROVED: [json]';const r2=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:cp}]})});const d2=await r2.json();const cr=d2.content[0].text.trim();if(!cr.startsWith('APPROVED:')){s.textContent='CheckerBot rejected. Try again.';return}const checked=JSON.parse(cr.replace('APPROVED:','').trim().replace(/```json|```/g,''));cards=[...cards,...checked];status=[...status,...new Array(checked.length).fill(null)];s.textContent='5 cards added! Now '+cards.length+' total.';updateProgress()}catch(e){s.textContent='Error: '+e.message}}
render();
</script>
</body>
</html>
