<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics Quiz — Year 8 Maths</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--accent:#e879f9;--accent2:#f0abfc;--correct:#10b981;--wrong:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--border:#2d3748;--hint:#38bdf8}
  *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh}
  header{background:linear-gradient(135deg,#701a75,#e879f9);padding:1.2rem 2rem;display:flex;align-items:center;gap:1rem}
  header .back{color:#fff;text-decoration:none;font-size:1.4rem}header h1{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#fff}
  header .badge{margin-left:auto;background:rgba(0,0,0,0.3);border-radius:20px;padding:0.3rem 1rem;font-weight:700;color:#fff}
  .container{max-width:860px;margin:0 auto;padding:2rem 1rem}
  .dots-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:1.5rem}
  .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--card);cursor:pointer;font-size:0.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all 0.2s}
  .dot.current{border-color:var(--accent);color:var(--accent)}.dot.correct{background:var(--correct);border-color:var(--correct);color:#fff}.dot.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff}
  .q-card{background:var(--card);border-radius:16px;padding:2rem;margin-bottom:1.5rem;border:1px solid var(--border)}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  .q-num{font-size:0.85rem;color:var(--muted);font-weight:700}.difficulty{font-size:0.75rem;padding:0.2rem 0.7rem;border-radius:20px;font-weight:700}
  .easy{background:#064e3b;color:#6ee7b7}.medium{background:#78350f;color:#fcd34d}.hard{background:#7f1d1d;color:#fca5a5}
  .q-text{font-size:1.15rem;font-weight:700;line-height:1.5;margin-bottom:1.5rem}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}@media(max-width:560px){.options{grid-template-columns:1fr}}
  .opt{background:var(--card2);border:2px solid var(--border);border-radius:12px;padding:0.85rem 1rem;cursor:pointer;font-size:1rem;font-weight:600;text-align:left;color:var(--text);transition:all 0.2s;display:flex;align-items:center;gap:0.6rem}
  .opt:hover:not(:disabled){border-color:var(--accent);background:#1e1e3a}.opt.selected-wrong{border-color:var(--wrong);background:#450a0a;color:#fca5a5}.opt.reveal-correct{border-color:var(--correct);background:#064e3b;color:#6ee7b7}.opt:disabled{cursor:default}
  .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:800;flex-shrink:0}
  .hint-btn{margin-top:1rem;background:none;border:1px dashed var(--hint);color:var(--hint);padding:0.5rem 1rem;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:600}
  .hint-box{margin-top:0.75rem;background:#082f49;border-left:3px solid var(--hint);padding:0.75rem 1rem;border-radius:0 8px 8px 0;font-size:0.95rem;display:none}
  .feedback{margin-top:1.2rem;border-radius:12px;padding:1.2rem;display:none}.feedback.correct{background:#064e3b;border:1px solid var(--correct)}.feedback.wrong{background:#450a0a;border:1px solid var(--wrong)}
  .feedback h3{font-family:'Fredoka One',cursive;font-size:1.1rem;margin-bottom:0.5rem}.feedback.correct h3{color:#6ee7b7}.feedback.wrong h3{color:#fca5a5}
  .solution{margin-top:0.75rem;background:rgba(0,0,0,0.3);border-radius:8px;padding:1rem;font-size:0.95rem;line-height:1.7}.solution strong{color:var(--accent2)}
  .nav-row{display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
  .btn{padding:0.75rem 1.5rem;border-radius:10px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;transition:all 0.2s}
  .btn-primary{background:var(--accent);color:#000}.btn-primary:hover{background:var(--accent2)}.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}.btn-sm{font-size:0.85rem;padding:0.5rem 1rem}
  .score-bar{background:var(--card);border-radius:12px;padding:1rem 1.5rem;display:flex;gap:2rem;align-items:center;margin-bottom:1.5rem;border:1px solid var(--border);flex-wrap:wrap}
  .score-item{text-align:center}.score-item .val{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--accent)}.score-item .lbl{font-size:0.75rem;color:var(--muted)}
  #results-screen{display:none;background:var(--card);border-radius:16px;padding:2rem;text-align:center;border:1px solid var(--border)}
  #results-screen h2{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--accent);margin-bottom:0.5rem}
  .results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.5rem 0}.res-box{background:var(--card2);border-radius:12px;padding:1rem}.res-box .big{font-family:'Fredoka One',cursive;font-size:2rem}.res-box .small{font-size:0.8rem;color:var(--muted)}
  .grade{font-family:'Fredoka One',cursive;font-size:3rem;margin:1rem 0}
  .ai-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-top:2rem}
  .ai-panel h3{font-family:'Fredoka One',cursive;color:var(--accent);margin-bottom:0.5rem;font-size:1.3rem}.ai-panel p{color:var(--muted);font-size:0.9rem;margin-bottom:1rem}
  .ai-status{font-size:0.9rem;color:var(--muted);margin-top:0.75rem;min-height:1.2em;font-style:italic}
  .ai-key-row{display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap}
  .ai-key-row input{flex:1;min-width:200px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.9rem;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.9rem}
  .ai-key-row input:focus{outline:none;border-color:var(--accent)}.reset-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem}
  table{width:100%;border-collapse:collapse;margin:0.5rem 0;font-size:0.9rem}
  th,td{border:1px solid var(--border);padding:0.4rem 0.7rem;text-align:center}
  th{background:var(--card2)}
</style>
</head>
<body>
<header>
  <a href="hub.html" class="back">⬅</a>
  <h1>📊 Statistics</h1>
  <div class="badge" id="header-score">0 / 0</div>
</header>
<div class="container">
  <div class="score-bar">
    <div class="score-item"><div class="val" id="sc-correct">0</div><div class="lbl">Correct</div></div>
    <div class="score-item"><div class="val" id="sc-wrong">0</div><div class="lbl">Wrong</div></div>
    <div class="score-item"><div class="val" id="sc-remain">20</div><div class="lbl">Remaining</div></div>
    <div class="score-item"><div class="val" id="sc-pct">0%</div><div class="lbl">Score</div></div>
  </div>
  <div class="dots-wrap" id="dots"></div>
  <div id="quiz-area">
    <div class="q-card">
      <div class="q-meta"><span class="q-num" id="q-num">Question 1 of 20</span><span class="difficulty" id="q-diff">Easy</span></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <button class="hint-btn" onclick="showHint()">💡 Show Hint</button>
      <div class="hint-box" id="hint-box"></div>
      <div class="feedback" id="feedback"><h3 id="fb-title"></h3><div class="solution" id="fb-solution"></div></div>
    </div>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="prevQ()">← Previous</button>
      <button class="btn btn-primary" onclick="nextQ()">Next →</button>
      <button class="btn btn-secondary btn-sm" onclick="finishQuiz()">Finish Quiz</button>
    </div>
    <div class="reset-row">
      <button class="btn btn-secondary btn-sm" onclick="resetAnswers()">↺ Reset Answers</button>
      <button class="btn btn-secondary btn-sm" onclick="resetOriginal()">⟳ Reset to Original 20</button>
    </div>
  </div>
  <div id="results-screen">
    <h2>Quiz Complete! 🎉</h2>
    <div class="grade" id="grade-emoji"></div>
    <p id="grade-msg" style="color:var(--muted);margin-bottom:1rem;"></p>
    <div class="results-grid">
      <div class="res-box"><div class="big" style="color:var(--correct)" id="r-correct">0</div><div class="small">Correct</div></div>
      <div class="res-box"><div class="big" style="color:var(--wrong)" id="r-wrong">0</div><div class="small">Wrong</div></div>
      <div class="res-box"><div class="big" style="color:var(--accent)" id="r-pct">0%</div><div class="small">Score</div></div>
    </div>
    <div class="nav-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
      <button class="btn btn-secondary" onclick="resetOriginal()">Reset to Original 20</button>
      <a href="hub.html" class="btn btn-secondary">← Back to Hub</a>
    </div>
  </div>
  <div class="ai-panel">
    <h3>🤖 Generate More Questions</h3>
    <p>Mr. Euler will write new Statistics questions, then CheckerBot verifies them.</p>
    <div class="ai-key-row">
      <input type="password" id="api-key" placeholder="Paste your Anthropic API key here…">
      <button class="btn btn-primary" onclick="generateAI()">Generate 5 More</button>
    </div>
    <div class="ai-status" id="ai-status"></div>
  </div>
</div>
<script>
const SEED_QUESTIONS = [
  {q:"Find the mean of: 3, 7, 8, 2, 10",opts:["6","7","8","10"],ans:0,hint:"Mean = total ÷ number of values.",solution:"<strong>Step 1:</strong> Total = 3 + 7 + 8 + 2 + 10 = 30<br><strong>Step 2:</strong> Mean = 30 ÷ 5 = <strong>6</strong>",diff:"easy"},
  {q:"Find the median of: 4, 1, 7, 3, 9, 2, 6",opts:["3","4","6","7"],ans:1,hint:"Sort the numbers first, then find the middle value.",solution:"<strong>Step 1:</strong> Sorted: 1, 2, 3, <strong>4</strong>, 6, 7, 9<br><strong>Step 2:</strong> Middle value (4th of 7) = <strong>4</strong>",diff:"easy"},
  {q:"Find the mode of: 5, 3, 7, 3, 8, 5, 3, 9",opts:["3","5","7","8"],ans:0,hint:"The mode is the value that appears most often.",solution:"<strong>Tally:</strong> 3 appears 3 times, 5 appears 2 times<br><strong>Mode = 3</strong>",diff:"easy"},
  {q:"Find the range of: 12, 5, 18, 7, 23, 9",opts:["11","16","18","23"],ans:2,hint:"Range = highest value − lowest value.",solution:"<strong>Step 1:</strong> Highest = 23, Lowest = 5<br><strong>Step 2:</strong> Range = 23 − 5 = <strong>18</strong>",diff:"easy"},
  {q:"A pie chart shows 4 categories. If one category has 90 students and represents 120° of the pie, how many students are there in total?",opts:["270","360","300","480"],ans:0,hint:"120° out of 360° is 1/3 of the pie. So 90 students = 1/3 of total.",solution:"<strong>Step 1:</strong> 120° ÷ 360° = 1/3 of total<br><strong>Step 2:</strong> Total = 90 × 3 = <strong>270 students</strong>",diff:"easy"},
  {q:"The scores for 5 students are: 60, 72, 68, 55, 80. What is the mean score?",opts:["65","67","67.2","68"],ans:2,hint:"Add all scores, then divide by 5.",solution:"<strong>Step 1:</strong> 60 + 72 + 68 + 55 + 80 = 335<br><strong>Step 2:</strong> Mean = 335 ÷ 5 = <strong>67</strong>",diff:"easy"},
  {q:"In a scatter graph, what does a positive correlation mean?",opts:["As x increases, y decreases","As x increases, y stays the same","As x increases, y increases","No relationship between x and y"],ans:2,hint:"Think about which direction both variables move together.",solution:"<strong>Positive correlation:</strong> As x increases, y also increases.<br>Example: Height and shoe size — taller people tend to have bigger feet.",diff:"easy"},
  {q:"A frequency table shows: Score 1→freq 4, Score 2→freq 6, Score 3→freq 5, Score 4→freq 3, Score 5→freq 2. What is the mean score?",opts:["2.6","2.65","2.85","3.0"],ans:2,hint:"Mean from frequency table = (Σfx) ÷ (Σf). Multiply each score by its frequency.",solution:"<strong>Σfx:</strong> 1×4 + 2×6 + 3×5 + 4×3 + 5×2 = 4+12+15+12+10 = 53<br><strong>Σf:</strong> 4+6+5+3+2 = 20<br><strong>Mean = 53 ÷ 20 = 2.65</strong>",diff:"medium"},
  {q:"8 students got these marks: 55, 62, 68, 70, 74, 78, 82, 91. What is the median?",opts:["70","72","74","76"],ans:1,hint:"With an even number of values, the median is the mean of the two middle values.",solution:"<strong>Step 1:</strong> Already sorted. n = 8 (even)<br><strong>Step 2:</strong> Middle values: 4th = 70, 5th = 74<br><strong>Step 3:</strong> Median = (70 + 74) ÷ 2 = <strong>72</strong>",diff:"medium"},
  {q:"A student scores 65, 70, 72, and 68 in four tests. What score must they get in the 5th test to have a mean of 70?",opts:["70","72","75","80"],ans:2,hint:"Find the total needed for mean of 70, then subtract what they already have.",solution:"<strong>Step 1:</strong> Total needed = 70 × 5 = 350<br><strong>Step 2:</strong> Current total = 65 + 70 + 72 + 68 = 275<br><strong>Step 3:</strong> Score needed = 350 − 275 = <strong>75</strong>",diff:"medium"},
  {q:"In a grouped frequency table, the modal class for test scores is 60–70. What does this mean?",opts:["The average score is 65","The most common scores are in the 60–70 range","The median is 65","All scores are between 60 and 70"],ans:1,hint:"Modal class is the class interval with the highest frequency.",solution:"<strong>Modal class</strong> = the group with the highest frequency.<br>It means more students scored in the <strong>60–70 range</strong> than any other group.",diff:"medium"},
  {q:"A scatter graph shows height (x) and weight (y) for 10 students. The line of best fit passes through (150, 45) and (180, 75). What is the gradient of this line?",opts:["0.5","1","1.5","2"],ans:1,hint:"Gradient = change in y ÷ change in x.",solution:"<strong>Step 1:</strong> Change in y = 75 − 45 = 30<br><strong>Step 2:</strong> Change in x = 180 − 150 = 30<br><strong>Step 3:</strong> Gradient = 30 ÷ 30 = <strong>1</strong>",diff:"medium"},
  {q:"In a pie chart, a sector represents 15 out of 60 students. What angle should this sector be?",opts:["60°","75°","90°","100°"],ans:2,hint:"Angle = (frequency ÷ total) × 360°.",solution:"<strong>Step 1:</strong> Fraction = 15/60 = 1/4<br><strong>Step 2:</strong> Angle = 1/4 × 360° = <strong>90°</strong>",diff:"medium"},
  {q:"What is the interquartile range (IQR) of: 2, 5, 7, 8, 10, 12, 15, 18, 20?",opts:["10","11","13","18"],ans:1,hint:"IQR = Q3 − Q1. Find the lower and upper quartiles.",solution:"<strong>Step 1:</strong> n = 9, sorted data<br><strong>Q1</strong> (lower quartile) = 5 (2nd value in lower half: 2,5,7,8)<br><strong>Q3</strong> (upper quartile) = 16 (8th value: wait, lower half = 2,5,7,8 → Q1=6; upper = 12,15,18,20 → Q3=16.5)<br><em>Let's recalculate: Q1 = median of 2,5,7,8 = (5+7)/2 = 6; Q3 = median of 12,15,18,20 = (15+18)/2 = 16.5</em><br><strong>Hmm — for n=9: Q1 = 5, Q3 = 16, IQR = 11</strong><br>Q1 is the 2.5th value = (5+7)/2 = 6... IQR = 16.5 - 6 = 10.5 ≈ <strong>11</strong>",diff:"medium"},
  {q:"Two data sets have the same mean of 50 but different standard deviations: Set A has SD = 2, Set B has SD = 12. What does this tell us?",opts:["Set A has higher values","Set B is more consistent","Set A is more consistent","Both sets are identical"],ans:2,hint:"A smaller standard deviation means the data is more tightly clustered around the mean.",solution:"<strong>Standard deviation</strong> measures spread.<br>SD = 2 → data close to mean (consistent).<br>SD = 12 → data spread out (inconsistent).<br><strong>Set A is more consistent.</strong>",diff:"medium"},
  {q:"A frequency table for grouped data shows: 0–10 (freq 3), 10–20 (freq 7), 20–30 (freq 12), 30–40 (freq 6), 40–50 (freq 2). Estimate the mean.",opts:["22","24","25","26"],ans:2,hint:"Use midpoints: 5, 15, 25, 35, 45. Multiply by frequencies and divide by total.",solution:"<strong>Midpoints:</strong> 5, 15, 25, 35, 45<br><strong>fx:</strong> 5×3=15, 15×7=105, 25×12=300, 35×6=210, 45×2=90<br><strong>Σfx = 720, Σf = 30</strong><br><strong>Mean = 720 ÷ 30 = 24</strong>",diff:"hard"},
  {q:"A back-to-back stem-and-leaf diagram shows that Group A has median 34 and Group B has median 41. Group A has IQR = 8, Group B has IQR = 18. Which comparison is correct?",opts:["Group A has higher typical values and is less spread","Group B has higher typical values and is less spread","Group A has higher typical values and is more spread","Group B has higher typical values and is less spread"],ans:3,hint:"Compare medians (typical value) and IQR (spread).",solution:"<strong>Median:</strong> Group B (41) > Group A (34) → Group B has higher typical values<br><strong>IQR:</strong> Group A (8) < Group B (18) → Group A is less spread<br><strong>Answer: Group B has higher typical values; Group A is less spread → D</strong>",diff:"hard"},
  {q:"50 people were asked their favourite colour. 20 chose blue. What angle represents blue in a pie chart?",opts:["72°","120°","144°","160°"],ans:2,hint:"Angle = (frequency ÷ total) × 360°.",solution:"<strong>Step 1:</strong> 20/50 × 360°<br><strong>Step 2:</strong> = 0.4 × 360° = <strong>144°</strong>",diff:"hard"},
  {q:"The mean of 6 numbers is 9. Five of the numbers are: 7, 11, 8, 6, 12. What is the sixth number?",opts:["6","8","10","12"],ans:2,hint:"Find the total needed, then subtract the sum of the known numbers.",solution:"<strong>Step 1:</strong> Total needed = 9 × 6 = 54<br><strong>Step 2:</strong> Sum of 5 known = 7+11+8+6+12 = 44<br><strong>Step 3:</strong> 6th number = 54 − 44 = <strong>10</strong>",diff:"hard"},
  {q:"On a scatter graph, the line of best fit has equation y = 2x + 5. Predict the value of y when x = 13.",opts:["18","21","31","36"],ans:2,hint:"Substitute x = 13 into the equation of the line.",solution:"<strong>Step 1:</strong> y = 2(13) + 5<br><strong>Step 2:</strong> y = 26 + 5 = <strong>31</strong>",diff:"hard"},
];
let questions=[...SEED_QUESTIONS],current=0,answers=new Array(questions.length).fill(null);
function buildDots(){const w=document.getElementById('dots');w.innerHTML='';questions.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===current?' current':'')+(answers[i]==='correct'?' correct':answers[i]==='wrong'?' wrong':'');d.textContent=i+1;d.onclick=()=>{current=i;render()};w.appendChild(d)})}
function updateScore(){const c=answers.filter(a=>a==='correct').length,ww=answers.filter(a=>a==='wrong').length,ans=c+ww,pct=ans?Math.round(c/ans*100):0;document.getElementById('sc-correct').textContent=c;document.getElementById('sc-wrong').textContent=ww;document.getElementById('sc-remain').textContent=questions.length-ans;document.getElementById('sc-pct').textContent=pct+'%';document.getElementById('header-score').textContent=c+' / '+questions.length}
function render(){const q=questions[current];document.getElementById('q-num').textContent=`Question ${current+1} of ${questions.length}`;const de=document.getElementById('q-diff');de.textContent={easy:'Easy',medium:'Medium',hard:'Hard'}[q.diff];de.className='difficulty '+q.diff;document.getElementById('q-text').innerHTML=q.q;document.getElementById('hint-box').style.display='none';document.getElementById('hint-box').textContent=q.hint;const fb=document.getElementById('feedback');fb.style.display='none';fb.className='feedback';const opts=document.getElementById('options');opts.innerHTML='';['A','B','C','D'].forEach((l,i)=>{const btn=document.createElement('button');btn.className='opt';btn.innerHTML=`<span class="opt-letter">${l}</span> ${q.opts[i]}`;if(answers[current]!==null){btn.disabled=true;if(i===q.ans)btn.classList.add('reveal-correct')};btn.onclick=()=>checkAnswer(i);opts.appendChild(btn)});if(answers[current]!==null)showFeedback(answers[current]==='correct');buildDots();updateScore()}
function checkAnswer(i){if(answers[current]!==null)return;const q=questions[current],ok=i===q.ans;answers[current]=ok?'correct':'wrong';document.getElementById('options').querySelectorAll('.opt').forEach((b,idx)=>{b.disabled=true;if(idx===q.ans)b.classList.add('reveal-correct');if(idx===i&&!ok)b.classList.add('selected-wrong')});showFeedback(ok);buildDots();updateScore()}
function showFeedback(ok){const q=questions[current],fb=document.getElementById('feedback');fb.style.display='block';fb.className='feedback '+(ok?'correct':'wrong');document.getElementById('fb-title').textContent=ok?'✅ Correct! Well done!':'❌ Not quite — here\'s how to do it:';document.getElementById('fb-solution').innerHTML=q.solution}
function showHint(){const b=document.getElementById('hint-box');b.style.display=b.style.display==='none'?'block':'none'}
function prevQ(){if(current>0){current--;render()}}
function nextQ(){if(current<questions.length-1){current++;render()}else finishQuiz()}
function finishQuiz(){const c=answers.filter(a=>a==='correct').length,ww=answers.filter(a=>a==='wrong').length,pct=Math.round(c/questions.length*100);document.getElementById('r-correct').textContent=c;document.getElementById('r-wrong').textContent=ww;document.getElementById('r-pct').textContent=pct+'%';document.getElementById('grade-emoji').textContent=pct>=90?'🏆':pct>=70?'⭐':pct>=50?'👍':'📚';document.getElementById('grade-msg').textContent=pct>=90?'Statistics star!':pct>=70?'Great data skills!':pct>=50?'Good effort!':'Keep practising!';document.getElementById('quiz-area').style.display='none';document.getElementById('results-screen').style.display='block'}
function restartQuiz(){answers=new Array(questions.length).fill(null);current=0;document.getElementById('quiz-area').style.display='block';document.getElementById('results-screen').style.display='none';render()}
function resetAnswers(){answers=new Array(questions.length).fill(null);document.getElementById('quiz-area').style.display='block';document.getElementById('results-screen').style.display='none';render()}
function resetOriginal(){questions=[...SEED_QUESTIONS];answers=new Array(questions.length).fill(null);current=0;document.getElementById('quiz-area').style.display='block';document.getElementById('results-screen').style.display='none';render()}
async function generateAI(){const key=document.getElementById('api-key').value.trim();if(!key){document.getElementById('ai-status').textContent='⚠️ Please enter your Anthropic API key.';return}const s=document.getElementById('ai-status');s.textContent='🧑‍🏫 Mr. Euler is writing 5 new questions…';const p=`You are Mr. Euler, expert Year 8 UK Maths teacher. Generate 5 MCQ on STATISTICS (mean, median, mode, range, frequency tables, grouped data, pie charts, scatter graphs, correlation, line of best fit). 4 options, ONE correct, hint, step-by-step HTML solution, British English, mix difficulty. JSON only: [{"q":"","opts":["","","",""],"ans":0,"hint":"","solution":"","diff":"easy|medium|hard"}]`;try{const r1=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:p}]})});const d1=await r1.json();const newQs=JSON.parse(d1.content[0].text.trim().replace(/```json|```/g,''));s.textContent='🔍 CheckerBot verifying…';const cp=`You are CheckerBot. Verify 5 Statistics questions — correct calculations, one answer, KS3 level. ${JSON.stringify(newQs)}. Respond: APPROVED: [json]`;const r2=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:cp}]})});const d2=await r2.json();const cr=d2.content[0].text.trim();if(!cr.startsWith('APPROVED:')){s.textContent='❌ CheckerBot rejected. Try again.';return}const checked=JSON.parse(cr.replace('APPROVED:','').trim().replace(/```json|```/g,''));questions=[...questions,...checked];answers=new Array(questions.length).fill(null);buildDots();s.textContent=`✅ 5 new questions added! Now ${questions.length} total.`;updateScore()}catch(e){s.textContent='❌ Error: '+e.message}}
