<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revision Hub — Year 8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0e17;
      color: #e8e8e8;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    header {
      text-align: center;
    }

    header .emoji { font-size: 3.5rem; line-height: 1; }

    header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.2rem, 7vw, 4rem);
      color: #e8e8e8;
      margin-top: 0.4rem;
    }

    header p {
      color: #a8a8b8;
      font-size: 1.05rem;
      margin-top: 0.4rem;
    }

    .subjects {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      justify-content: center;
    }

    .card {
      background: #1a1a2e;
      border: 2px solid transparent;
      border-radius: 1.25rem;
      padding: 2rem 2.5rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      width: 200px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover { transform: translateY(-4px); }

    .card .emoji { font-size: 2.8rem; }

    .card h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      margin-top: 0.6rem;
    }

    .card.geography { border-color: #38bdf8; }
    .card.geography h2 { color: #38bdf8; }

    .card.maths { border-color: #a78bfa; }
    .card.maths h2 { color: #a78bfa; }

    .card.science { border-color: #4ade80; }
    .card.science h2 { color: #4ade80; }

    .card .soon {
      font-size: 0.8rem;
      color: #a8a8b8;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="emoji">📚</div>
    <h1>Revision Hub</h1>
    <p>Year 8 — pick a subject to get started</p>
  </header>

  <nav class="subjects">
    <a class="card geography" href="geography/index.html">
      <div class="emoji">🌍</div>
      <h2>Geography</h2>
      <div class="soon">Coming soon</div>
    </a>
    <a class="card maths" href="maths/index.html">
      <div class="emoji">🔢</div>
      <h2>Maths</h2>
      <div class="soon">Coming soon</div>
    </a>
    <a class="card science" href="science/index.html">
      <div class="emoji">🔬</div>
      <h2>Science</h2>
      <div class="soon">Coming soon</div>
    </a>
  </nav>
</body>
</html>
